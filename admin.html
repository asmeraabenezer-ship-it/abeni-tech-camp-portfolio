<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Abeni Tech Camp</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <!-- Supabase SDK & Configuration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        .admin-section { padding-top: 120px; min-height: 100vh; }
        .admin-card { max-width: 600px; margin: 0 auto 50px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--accent-primary); font-weight: 600; }
        select { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-radius: 10px; color: #fff; outline: none; }
        select option { background: var(--bg-dark); }
        .project-list { margin-top: 50px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .admin-project-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; margin-bottom: 12px; background: var(--glass-bg); border-radius: 10px; border: 1px solid var(--glass-border); transition: var(--transition-smooth); }
        .admin-project-item:hover { transform: translateY(-2px); border-color: rgba(0, 242, 254, 0.4); }
        .admin-project-info { display: flex; align-items: center; gap: 15px; }
        .admin-project-thumb { width: 55px; height: 55px; object-fit: cover; border-radius: 8px; border: 1px solid var(--glass-border); }
        .delete-btn { color: #ff4b2b; cursor: pointer; transition: var(--transition-smooth); background: rgba(255, 75, 43, 0.1); border: 1px solid rgba(255, 75, 43, 0.3); border-radius: 8px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .delete-btn:hover { background: #ff4b2b; color: #fff; transform: scale(1.05); }
        .upload-btn { width: 100%; }
        .project-list-title { margin-bottom: 20px; text-align: center; }
        .project-item-title { font-weight: 600; font-size: 1.05rem; }
        .project-item-cat { font-size: 0.85rem; color: var(--text-muted); }
        .project-item-link { font-size: 0.8rem; color: var(--accent-primary); text-decoration: none; word-break: break-all; }

        /* Status & Config Alert */
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; margin-left: 8px; }
        .status-badge.finished { background: rgba(0, 242, 254, 0.2); color: var(--accent-primary); }
        .status-badge.progress { background: rgba(255, 180, 0, 0.2); color: #ffb400; }

        .config-warning {
            background: rgba(255, 75, 43, 0.15);
            border: 1px solid rgba(255, 75, 43, 0.4);
            color: #ff9d8f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 0.95rem;
            display: none;
        }
        .config-warning a { color: #fff; text-decoration: underline; }

        /* Login Overlay */
        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card { text-align: center; width: 100%; max-width: 400px; padding: 40px; }
        .login-title { margin-bottom: 25px; font-size: 1.8rem; color: #fff; }
        .login-btn { width: 100%; }
        .login-err { color: #ff4b2b; margin-top: 15px; display: none; font-size: 0.9rem; }
        #admin-content { display: none; }
    </style>
</head>
<body class="dark-mode">
    <!-- Secure Login Overlay -->
    <div id="login-overlay">
        <div class="login-card glass-card">
            <h2 class="login-title"><i class="fas fa-shield-halved"></i> Admin Portal</h2>
            <form id="login-form" class="contact-form">
                <div class="form-group">
                    <label for="admin-user" style="text-align: left;">Username</label>
                    <input type="text" id="admin-user" placeholder="Enter username (default: abeni)" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="admin-pass" style="text-align: left;">Passcode</label>
                    <input type="password" id="admin-pass" placeholder="Enter password (default: abeni2026)" required autocomplete="current-password">
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary login-btn">Login</button>
                <p id="login-err" class="login-err"></p>
            </form>
            <div style="margin-top: 20px;">
                <a href="index.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem;">&larr; Back to Portfolio</a>
            </div>
        </div>
    </div>

    <div id="admin-content">
        <nav class="navbar" style="padding: 10px 0; background: rgba(10, 10, 10, 0.95);">
            <div class="container nav-container">
                <a href="index.html" class="logo">Abeni<span>Admin</span></a>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <a href="index.html" class="btn btn-secondary"><i class="fas fa-external-link-alt"></i> View Site</a>
                    <a href="#" class="btn btn-primary" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </nav>

        <section class="admin-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title">Manage Portfolio Projects</h2>
                    <div class="title-underline"></div>
                </div>

                <!-- Missing Config Warning Banner -->
                <div id="config-warning" class="config-warning">
                    <i class="fas fa-triangle-exclamation"></i> <strong>Supabase Not Connected Yet:</strong> Please open <code>supabase-config.js</code> and paste your <strong>SUPABASE_URL</strong> and <strong>SUPABASE_ANON_KEY</strong>.
                </div>

                <!-- Upload Form -->
                <div class="admin-card glass-card">
                    <h3 style="margin-bottom: 20px;"><i class="fas fa-plus-circle"></i> Add New Project</h3>
                    <form id="upload-form" class="contact-form">
                        <div class="form-group">
                            <label for="title">Project Title</label>
                            <input type="text" id="title" placeholder="e.g. Modern Web App / Clinic Management" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" title="Select Project Category" required>
                                <option value="Web Development">Web Development</option>
                                <option value="Graphic Design">Graphic Design</option>
                                <option value="Video Editing">Video Editing</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="projectLink">Project Link / Live Demo (Optional)</label>
                            <input type="url" id="projectLink" placeholder="https://my-app.vercel.app">
                        </div>
                        <div class="form-group">
                            <label for="status">Project Status</label>
                            <select id="status" required>
                                <option value="Fully Finished">Fully Finished</option>
                                <option value="In Progress">In Progress</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="image">Project Screenshot / Image</label>
                            <input type="file" id="image" accept="image/*" required title="Choose project image">
                        </div>
                        <button type="submit" id="upload-btn" class="btn btn-primary upload-btn"><i class="fas fa-cloud-arrow-up"></i> Upload Project</button>
                    </form>
                </div>

                <!-- Project List -->
                <div class="project-list">
                    <h3 class="project-list-title"><i class="fas fa-list-check"></i> Live Projects in Supabase</h3>
                    <div id="admin-projects-container">
                        <!-- Projects loaded via Supabase -->
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const loginOverlay = document.getElementById('login-overlay');
        const adminContent = document.getElementById('admin-content');
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const loginErr = document.getElementById('login-err');
        const uploadForm = document.getElementById('upload-form');
        const uploadBtn = document.getElementById('upload-btn');
        const container = document.getElementById('admin-projects-container');
        const configWarning = document.getElementById('config-warning');

        // Check if Supabase keys are provided
        function isSupabaseReady() {
            return typeof supabaseClient !== 'undefined' && supabaseClient !== null;
        }

        // Check Auth on page load
        function checkAuthSession() {
            const isAuth = localStorage.getItem('abeni_admin_logged_in');
            if (isAuth === 'true') {
                showAdmin();
            } else {
                showLogin();
            }
        }

        // Login Handler
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            loginErr.style.display = 'none';

            const user = document.getElementById('admin-user').value.trim();
            const pass = document.getElementById('admin-pass').value;

            const expectedPass = typeof ADMIN_PASSCODE !== 'undefined' ? ADMIN_PASSCODE : 'abeni2026';

            if (pass === expectedPass) {
                localStorage.setItem('abeni_admin_logged_in', 'true');
                loginForm.reset();
                showAdmin();
            } else {
                loginErr.innerText = 'Invalid passcode. Please enter the correct admin password.';
                loginErr.style.display = 'block';
            }
        });

        function showAdmin() {
            loginOverlay.style.display = 'none';
            adminContent.style.display = 'block';

            if (!isSupabaseReady()) {
                configWarning.style.display = 'block';
                container.innerHTML = '<p style="color: #ff9d8f; text-align: center; padding: 25px;">Please paste your Supabase URL & Anon Key into <code>supabase-config.js</code> to enable live database storage.</p>';
            } else {
                configWarning.style.display = 'none';
                loadProjects();
            }
        }

        function showLogin() {
            loginOverlay.style.display = 'flex';
            adminContent.style.display = 'none';
        }

        function logout() {
            localStorage.removeItem('abeni_admin_logged_in');
            showLogin();
        }

        // Load Projects from Supabase
        async function loadProjects() {
            if (!isSupabaseReady()) return;

            container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 20px;"><i class="fas fa-spinner fa-spin"></i> Loading projects from Supabase...</p>';

            try {
                const { data: projects, error } = await supabaseClient
                    .from('projects')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) {
                    throw error;
                }

                container.innerHTML = '';
                if (!projects || projects.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 25px;">No projects found in Supabase yet. Upload your first one above!</p>';
                    return;
                }

                projects.forEach(p => {
                    const imgUrl = p.image_url || p.imagePath || 'images/hero_illustration.png';
                    const statusClass = (p.status === 'In Progress') ? 'progress' : 'finished';
                    const div = document.createElement('div');
                    div.className = 'admin-project-item';
                    div.innerHTML = `
                        <div class="admin-project-info">
                            <img src="${imgUrl}" class="admin-project-thumb" alt="${p.title}" onerror="this.src='images/hero_illustration.png'">
                            <div>
                                <div class="project-item-title">
                                    ${p.title} 
                                    <span class="status-badge ${statusClass}">${p.status || 'Fully Finished'}</span>
                                </div>
                                <div class="project-item-cat">${p.category}</div>
                                ${p.project_link ? `<a href="${p.project_link}" target="_blank" rel="noopener" class="project-item-link"><i class="fas fa-link"></i> ${p.project_link}</a>` : ''}
                            </div>
                        </div>
                        <button class="delete-btn" onclick="deleteProject('${p.id}')" aria-label="Delete Project" title="Delete Project">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error('Error fetching Supabase projects:', err);
                container.innerHTML = `<p style="color: #ff9d8f; text-align: center; padding: 20px;"><i class="fas fa-circle-exclamation"></i> Error loading projects: ${err.message || 'Make sure the projects table exists in Supabase.'}</p>`;
            }
        }

        // Upload Project to Supabase Storage & Database
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!isSupabaseReady()) {
                alert('Please enter your Supabase URL and Anon Key in supabase-config.js first.');
                return;
            }

            const title = document.getElementById('title').value.trim();
            const category = document.getElementById('category').value;
            const projectLink = document.getElementById('projectLink').value.trim();
            const status = document.getElementById('status').value;
            const fileInput = document.getElementById('image');
            const file = fileInput.files[0];

            if (!file) {
                alert('Please select an image for this project.');
                return;
            }

            uploadBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading to Supabase...';
            uploadBtn.disabled = true;

            try {
                // 1. Upload file to Supabase Storage bucket 'portfolio'
                const fileExt = file.name.split('.').pop();
                const sanitizedFileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.${fileExt}`;

                const { data: uploadData, error: uploadErr } = await supabaseClient
                    .storage
                    .from('portfolio')
                    .upload(sanitizedFileName, file, {
                        cacheControl: '3600',
                        upsert: false
                    });

                if (uploadErr) {
                    throw new Error(`Storage upload failed: ${uploadErr.message}. Make sure you have created a public bucket named "portfolio".`);
                }

                // 2. Get Public URL
                const { data: { publicUrl } } = supabaseClient
                    .storage
                    .from('portfolio')
                    .getPublicUrl(sanitizedFileName);

                // 3. Save Project Record to 'projects' table
                const { error: insertErr } = await supabaseClient
                    .from('projects')
                    .insert([{
                        title,
                        category,
                        project_link: projectLink,
                        status,
                        image_url: publicUrl
                    }]);

                if (insertErr) {
                    throw new Error(`Database insert failed: ${insertErr.message}. Make sure table "projects" exists.`);
                }

                alert('🎉 Project uploaded successfully to Supabase!');
                uploadForm.reset();
                loadProjects();
            } catch (err) {
                console.error('Upload Error:', err);
                alert(`Upload failed: ${err.message}`);
            } finally {
                uploadBtn.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> Upload Project';
                uploadBtn.disabled = false;
            }
        });

        // Delete Project
        async function deleteProject(id) {
            if (!isSupabaseReady()) return;

            if (confirm('Are you sure you want to delete this project from Supabase?')) {
                try {
                    const { error } = await supabaseClient
                        .from('projects')
                        .delete()
                        .eq('id', id);

                    if (error) throw error;
                    loadProjects();
                } catch (err) {
                    console.error('Delete error:', err);
                    alert(`Failed to delete project: ${err.message}`);
                }
            }
        }

        // Initialize Auth Check
        checkAuthSession();
    </script>
</body>
</html>
